name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Memory check
        run: free -m && java -version

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          CODE=$?
          {
            echo "## 构建结果"
            if [ $CODE -eq 0 ]; then echo "✅ 成功"; else echo "❌ 失败"; fi
            echo ""
            echo "### 日志前 45 行（启动阶段）"
            echo '```'
            head -n 45 build.log
            echo '```'
            echo "### 含 error 的行"
            echo '```'
            grep -i -m 25 -E "error|exception|outofmemory|failed|invalid|cannot" build.log | head -n 25
            echo '```'
            echo "### 日志后 25 行"
            echo '```'
            tail -n 25 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/outputs/apk/debug/app-debug.apk
