name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          CODE=$?
          echo "=================== DIAG START ==================="
          grep -m 1 -A 25 "What went wrong" build.log || true
          echo "=================== FIRST ERRORS ==================="
          grep -m 15 "^e: " build.log || true
          echo "=================== TAIL ==================="
          tail -n 40 build.log
          echo "=================== DIAG END ==================="
          exit $CODE

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/outputs/apk/debug/app-debug.apk
